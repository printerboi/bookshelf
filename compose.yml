services:
  postgres:
    image: postgres:16
    container_name: bookshelf_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookshelf
      POSTGRES_USER: ${DBUSER}
      POSTGRES_PASSWORD: ${DBPASSWORD}
    ports:
      - "5432:5432"
    networks:
      - bookshelf_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      DB_HOST: bookshelf_db
      DB_PORT: 5432
      DB_NAME: bookshelf
      DB_USER: ${DBUSER}
      DB_PASSWORD: ${DBPASSWORD}
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - bookshelf_network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      backend_host: backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - bookshelf_network
    
networks:
  bookshelf_network:
    driver: bridge

volumes:
  postgres_data: